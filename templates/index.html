<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://kit.fontawesome.com/c0cf90d40d.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
    <title>StoreFind</title>
</head>

<body>
    <div class="Home_BackGround">
        <nav class="navbar navbar-expand-lg w-100  navbar-dark navbar_bg fixed-top">
            <div class="container-fluid">
                <a class="navbar-brand logo" href="/">Store<span class="span_logo">Find</span></a>
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse mb-10" id="navbarNavAltMarkup">
                    <div class="navbar-nav ml-auto mr-2 mb-10">
                        <a class="nav-link active admin" href="/admin/login"><i class="fa-solid fa-unlock pr-2"></i> Admin <span class="sr-only">(current)</span></a>
                    </div>
                </div>
            </div>
        </nav>
    </div>
    <div class="Home_BackGround home-flexbox pl-4 pr-4">
        <div class="hero-text">
    <h1 class="h1find">
        <span class="line">Find any</span>
        <span class="line center">item.</span>
        <span class="line h1ele">Skip the</span>
        <span class="line h1ele">search.</span>
    </h1>
    </div>
        <p class="subtitle">Type a product name and instantly know exactly which aisle and shelf it's on.</p>
        <form class="search-wrap" action="/search" method="GET">
            <span class="search-icon"><i class="fa-brands fa-sistrix"></i></span>
            <input type="text" name="q" id="searchInput" placeholder="Search for milk, shampoo, rice..." autocomplete="off" class="input_text" required />
            <ul class="autocomplete-list" id="autocompleteList"></ul>
            <button type="submit" class="find">Find It →</button>
        </form>
        <div class="main-container">
            <div class="categories mb-5">
                <a href="/search?q=Dairy" class="chip">🥛 Dairy</a>
                <a href="/search?q=Snacks" class="chip">🍪 Snacks</a>
                <a href="/search?q=Personal Care" class="chip">🧴 Personal Care</a>
                <a href="/search?q=Beverages" class="chip">🥤 Beverages</a>
                <a href="/search?q=Grains" class="chip">🌾 Grains & Dal</a>
                <a href="/search?q=Frozen" class="chip">🧊 Frozen Foods</a>
                <a href="/search?q=Spices" class="chip">🌶 Spices</a>
                <a href="/search?q=Bakery" class="chip">🍞 Bakery</a>
            </div>
        </div>
    </div>
    <footer>
        StoreFind &copy; 2024 — Built with Flask &amp; SQLite |
        <a href="/admin/login">Admin Panel</a>
    </footer>
</body>

</html>
